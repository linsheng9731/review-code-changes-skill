<article class="change-group" id="{{GROUP_ID}}">
  <header>
    <h3>{{GROUP_TITLE}}</h3>
    <div class="meta">{{GROUP_META}}</div>
    <p>{{GROUP_INTRO}}</p>
  </header>
  <section class="group-review-units" aria-label="该改动点的代码对比及对应说明">

    {{GROUP_REVIEW_UNITS}}
  </section>
  <div class="group-conclusion">{{GROUP_CONCLUSION}}</div>
</article>
